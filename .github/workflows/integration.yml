name: Integration

on:
  pull_request:
  push:
    branches:
      - main
  # Reusable entry point so release.yml can gate publishing on this suite.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Scope the group by event so a release-triggered (workflow_call) run never shares a
# group with pull_request/push runs, and only those fast-feedback runs are cancellable.
concurrency:
  group: integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # Testcontainers provisions Redis, Postgres, SQL Server, RabbitMQ, and Mongo on the
  # runner's Docker daemon; no manual service startup is needed.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        framework: [net10.0, net11.0]

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: 1

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm

      - name: Restore dashboard dependencies
        run: npm ci --ignore-scripts

      - name: Restore packages
        run: dotnet restore DotCelery.slnx

      - name: Build
        run: dotnet build DotCelery.slnx --configuration Release --no-restore

      - name: Run integration tests
        run: >-
          dotnet test tests/DotCelery.Tests.Integration --configuration Release --no-build
          --framework ${{ matrix.framework }} --collect 'XPlat Code Coverage'
          --results-directory artifacts/coverage/integration

      - name: Upload integration coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-coverage-${{ matrix.framework }}
          path: artifacts/coverage/integration/**/coverage.cobertura.xml
          if-no-files-found: error
