services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dotcelery
      POSTGRES_USER: dotcelery
      POSTGRES_PASSWORD: dotcelery
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotcelery -d dotcelery"]
      interval: 5s
      timeout: 3s
      retries: 20
